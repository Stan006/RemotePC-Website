<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RemotePC · Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080a0e;
      --surface: #0e1117;
      --surface-hi: #131720;
      --border: #1c2030;
      --border-hi: #252c3f;
      --accent: #00c8ff;
      --accent-dim: rgba(0, 200, 255, 0.10);
      --accent-glow: rgba(0, 200, 255, 0.22);
      --accent-glow-lg: rgba(0, 200, 255, 0.12);
      --text: #dde1ec;
      --text-dim: #a0a8bc;
      --muted: #556070;
      --error: #ff4d6a;
      --success: #00e5a0;
      --input-bg: #090c11;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Fine grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* Top glow orb */
    .scene-glow {
      position: fixed;
      top: -260px;
      left: 50%;
      transform: translateX(-50%);
      width: 720px;
      height: 520px;
      background: radial-gradient(ellipse, rgba(0,200,255,0.07) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* Corner accent lines */
    .corner-tl, .corner-br {
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }
    .corner-tl {
      top: 24px; left: 24px;
      width: 60px; height: 60px;
      border-top: 1px solid rgba(0,200,255,0.18);
      border-left: 1px solid rgba(0,200,255,0.18);
    }
    .corner-br {
      bottom: 24px; right: 24px;
      width: 60px; height: 60px;
      border-bottom: 1px solid rgba(0,200,255,0.18);
      border-right: 1px solid rgba(0,200,255,0.18);
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      padding: 44px 40px;
      /* Layered shadows for depth */
      box-shadow:
        0 0 0 1px rgba(0,200,255,0.06),
        0 1px 0 0 rgba(255,255,255,0.03) inset,
        0 32px 64px rgba(0,0,0,0.55),
        0 8px 24px rgba(0,0,0,0.3);
      animation: fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* Subtle top-edge highlight */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 20px; right: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,200,255,0.35), transparent);
      border-radius: 0 0 4px 4px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent-glow);
      animation: pulse 2.4s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent-glow); }
      50%       { opacity: 0.45; box-shadow: 0 0 4px var(--accent); }
    }

    h1 {
      font-size: 21px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
      line-height: 1.6;
      font-weight: 400;
    }

    label {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      padding: 13px 46px 13px 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      letter-spacing: 0.04em;
    }

    input::placeholder { color: var(--muted); opacity: 0.6; }

    input:focus {
      border-color: var(--accent);
      background: #0b0e16;
      box-shadow: 0 0 0 3px var(--accent-dim), 0 0 12px rgba(0,200,255,0.06);
    }

    .toggle-eye {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
      opacity: 0.7;
    }
    .toggle-eye:hover { color: var(--accent); opacity: 1; }

    /* Strength meter */
    .strength-bar {
      display: flex;
      gap: 5px;
      margin-top: 9px;
      margin-bottom: 5px;
    }

    .strength-bar span {
      flex: 1;
      height: 2.5px;
      border-radius: 99px;
      background: var(--border);
      transition: background 0.35s ease;
    }

    .strength-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
      font-weight: 500;
    }

    /* Primary button */
    button.primary {
      width: 100%;
      background: var(--accent);
      color: #04080f;
      border: none;
      border-radius: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      padding: 14px;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: opacity 0.2s, transform 0.18s cubic-bezier(0.22,1,0.36,1), box-shadow 0.2s;
      margin-top: 6px;
      box-shadow: 0 0 24px var(--accent-glow), 0 4px 12px rgba(0,200,255,0.15);
      position: relative;
      overflow: hidden;
    }

    button.primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    button.primary:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-2px);
      box-shadow: 0 0 32px var(--accent-glow), 0 8px 20px rgba(0,200,255,0.2);
    }
    button.primary:active:not(:disabled) { transform: translateY(0); }
    button.primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Alerts */
    .alert {
      border-radius: 8px;
      padding: 13px 16px;
      font-size: 12.5px;
      line-height: 1.55;
      margin-bottom: 22px;
      display: none;
      font-family: 'IBM Plex Mono', monospace;
    }

    .alert.error {
      background: rgba(255,77,106,0.08);
      border: 1px solid rgba(255,77,106,0.25);
      color: #ff8fa3;
    }

    .alert.success {
      background: rgba(0,229,160,0.06);
      border: 1px solid rgba(0,229,160,0.22);
      color: var(--success);
    }

    .alert.show { display: block; animation: fadeUp 0.25s ease both; }

    /* Views */
    .view { display: none; }
    .view.active { display: block; }

    /* Icon circle */
    .icon-wrap {
      width: 52px; height: 52px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 22px;
    }

    .icon-wrap.ok  {
      background: rgba(0,229,160,0.08);
      box-shadow: 0 0 20px rgba(0,229,160,0.15);
    }
    .icon-wrap.err {
      background: rgba(255,77,106,0.08);
      box-shadow: 0 0 20px rgba(255,77,106,0.15);
    }

    /* Spinner */
    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0 4px;
    }

    .spinner {
      width: 32px; height: 32px;
      border: 1.5px solid var(--border-hi);
      border-top-color: var(--accent);
      border-right-color: rgba(0,200,255,0.4);
      border-radius: 50%;
      animation: spin 0.75s cubic-bezier(0.45,0.05,0.55,0.95) infinite;
      margin-bottom: 18px;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 22px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--accent);
      text-decoration: none;
      opacity: 0.65;
      transition: opacity 0.2s, gap 0.2s;
    }
    .back-link:hover { opacity: 1; gap: 10px; }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-hi), transparent);
      margin: 28px 0;
    }
  </style>
</head>
<body>
<div class="scene-glow"></div>
<div class="corner-tl"></div>
<div class="corner-br"></div>

<div class="card">
  <div class="logo"><span class="logo-dot"></span>RemotePC - Account Management</div>

  <!-- LOADING -->
  <div class="view active" id="view-loading">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <p class="subtitle" style="text-align:center; margin-bottom:0">Verifying your request…</p>
    </div>
  </div>

  <!-- RESET PASSWORD FORM -->
  <div class="view" id="view-reset">
    <h1>Set new password</h1>
    <p class="subtitle">Choose a strong password for your account.</p>

    <div class="alert error" id="reset-error"></div>

    <div class="input-wrap">
      <label for="pw1">New password</label>
      <input type="password" id="pw1" placeholder="••••••••••••" autocomplete="new-password" oninput="checkStrength()">
      <button class="toggle-eye" type="button" onclick="togglePw('pw1',this)" aria-label="Show password">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="strength-bar" id="strength-bar">
      <span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span>
    </div>
    <div class="strength-label" id="strength-label">—</div>

    <div class="input-wrap">
      <label for="pw2">Confirm password</label>
      <input type="password" id="pw2" placeholder="••••••••••••" autocomplete="new-password">
      <button class="toggle-eye" type="button" onclick="togglePw('pw2',this)" aria-label="Show password">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <button class="primary" id="reset-btn" onclick="doReset()">Set New Password</button>
  </div>

  <!-- SUCCESS -->
  <div class="view" id="view-success">
    <div class="icon-wrap ok">
      <svg width="22" height="22" fill="none" stroke="#00e5a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1 id="success-title">Done!</h1>
    <p class="subtitle" id="success-msg"></p>
    <div class="divider"></div>
    <a class="back-link" href="/">← Back to app</a>
  </div>

  <!-- ERROR -->
  <div class="view" id="view-error">
    <div class="icon-wrap err">
      <svg width="22" height="22" fill="none" stroke="#ff4d6a" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <h1>Link Invalid</h1>
    <p class="subtitle" id="error-msg">This link has expired or already been used. Please request a new one.</p>
    <div class="divider"></div>
    <a class="back-link" href="/">← Back to app</a>
  </div>
</div>

<!-- ─── Firebase via CDN (no build step needed) ─── -->
<script type="module">
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 🔧 PASTE YOUR FIREBASE CONFIG HERE
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const firebaseConfig = {
  apiKey: "AIzaSyBPJIGtF1X_P3B_7Ir_zmNRRSqqve5xqs0",
  authDomain: "remotepc-admin-console.firebaseapp.com",
  databaseURL: "https://remotepc-admin-console-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "remotepc-admin-console",
  storageBucket: "remotepc-admin-console.firebasestorage.app",
  messagingSenderId: "5553110565",
  appId: "1:5553110565:web:a719883bac45afdf3c89cc"
};
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  import { initializeApp }                        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, applyActionCode, confirmPasswordReset, verifyPasswordResetCode }
                                                  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const params  = new URLSearchParams(window.location.search);
  const mode    = params.get("mode");
  const oobCode = params.get("oobCode");

  // expose for inline handlers
  window._auth    = auth;
  window._oobCode = oobCode;

  function show(id) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function showSuccess(title, msg) {
    document.getElementById("success-title").textContent = title;
    document.getElementById("success-msg").textContent   = msg;
    show("view-success");
  }

  function showError(msg) {
    document.getElementById("error-msg").textContent = msg || "This link has expired or already been used.";
    show("view-error");
  }

  if (!oobCode || !mode) {
    showError("No action code found in this URL.");
  } else if (mode === "resetPassword") {
    verifyPasswordResetCode(auth, oobCode)
      .then(() => show("view-reset"))
      .catch(() => showError("This password reset link has expired or already been used."));

  } else if (mode === "verifyEmail") {
    applyActionCode(auth, oobCode)
      .then(() => showSuccess("Email Verified", "Your email address has been verified. You can now sign in."))
      .catch(e => showError(friendlyError(e)));

  } else if (mode === "recoverEmail") {
    applyActionCode(auth, oobCode)
      .then(() => showSuccess("Email Recovered", "Your email address has been restored. Check your inbox for further instructions."))
      .catch(e => showError(friendlyError(e)));

  } else {
    showError("Unknown action. Please check the link and try again.");
  }

  function friendlyError(e) {
    const map = {
      "auth/expired-action-code":  "This link has expired. Please request a new one.",
      "auth/invalid-action-code":  "This link is invalid or has already been used.",
      "auth/user-disabled":        "This account has been disabled.",
      "auth/user-not-found":       "No account found for this link.",
    };
    return map[e.code] || "Something went wrong. Please try again.";
  }

  window.doReset = async function () {
    const pw1 = document.getElementById("pw1").value;
    const pw2 = document.getElementById("pw2").value;
    const err = document.getElementById("reset-error");
    const btn = document.getElementById("reset-btn");

    err.classList.remove("show");

    if (pw1.length < 8) {
      err.textContent = "Password must be at least 8 characters.";
      return err.classList.add("show");
    }
    if (pw1 !== pw2) {
      err.textContent = "Passwords do not match.";
      return err.classList.add("show");
    }

    btn.disabled = true;
    btn.textContent = "Saving…";

    try {
      await confirmPasswordReset(window._auth, window._oobCode, pw1);
      showSuccess("Password Updated", "Your password has been changed. You can now sign in with your new password.");
    } catch (e) {
      err.textContent = friendlyError(e);
      err.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Set New Password";
    }
  };
</script>

<script>
  function checkStrength() {
    const pw    = document.getElementById("pw1").value;
    const bars  = [document.getElementById("s1"), document.getElementById("s2"),
                   document.getElementById("s3"), document.getElementById("s4")];
    const label = document.getElementById("strength-label");

    let score = 0;
    if (pw.length >= 8)               score++;
    if (/[A-Z]/.test(pw))             score++;
    if (/[0-9]/.test(pw))             score++;
    if (/[^A-Za-z0-9]/.test(pw))      score++;

    const colors = ["#ff4d6a","#ff9f43","#f7c948","#00e5a0"];
    const labels = ["Weak","Fair","Good","Strong"];

    bars.forEach((b, i) => b.style.background = i < score ? colors[score - 1] : "");
    label.textContent = pw ? labels[score - 1] || "Weak" : "—";
    label.style.color = pw ? colors[score - 1] : "";
  }

  function togglePw(id, btn) {
    const input = document.getElementById(id);
    const isText = input.type === "text";
    input.type = isText ? "password" : "text";
    btn.innerHTML = isText
      ? `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`
      : `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
  }
</script>
</body>
</html>
