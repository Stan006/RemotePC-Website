  'vpn': {
    title:    'Why do VPNs interfere with <span class="text-gradient">RemotePC</span>',
    subtitle: 'Well, they don\'t — you can still use all remote functionalities but with some caveats. Here\'s the full explanation.',
    category: { icon: 'rocket', label: 'Article: VPN Interference' },
    meta: { date: 'January 20, 2026', readTime: '5 min read', author: 'RemotePC Team' },
    image: { src: '/assets/VPNEXAMP.png', alt: 'VPN interference with RemotePC' },
    content: `
      <p>
        When you connect to a VPN, the VPN client may modify your machine's network routing table. This reroutes traffic destined for the internet to pass through the VPN tunnel instead of using your local network directly. However, the way routing is configured can also affect local traffic, even if that traffic is not intended to go through the VPN.
      </p>
      <p>
        Specifically, VPNs may add or modify routes that reroute traffic intended for your LAN (Local Area Network). This can occur when the VPN overrides or misconfigures your machine's routing table, potentially preventing direct access to local network services.
      </p>
      <h2>How this causes problems with RemotePC.</h2>
      <p>
        NAT (Network Address Translation) is commonly used by VPN providers to allow multiple clients to share a single public IP address. When you connect to a VPN, your machine is typically assigned a private internal IP address within the VPN's virtual subnet (for example, 10.2.0.10). Depending on the VPN configuration, most or all internet-bound traffic may be routed through the VPN server, while local network traffic may or may not be routed through the tunnel.
      </p>
      <p>
        VPNs often introduce a NAT boundary and routing separation between your local network and the VPN tunnel. If traffic that would normally remain on the local network is routed through the VPN, this can cause issues such as:<br><br>
        <b>Connection failures:</b> Local services that expect traffic from LAN IP ranges (for example, 192.168.x.x) may reject connections arriving from the VPN's internal address space.<br><br>
        <b>UDP issues:</b> NAT performed by the VPN may alter source IPs or ports, and short NAT timeouts can disrupt UDP-based applications that rely on consistent addressing.<br><br>
        <b>TCP issues:</b> Existing TCP connections may be interrupted if routing changes, NAT state is reset, or firewall rules associated with the VPN block or reroute traffic.
      </p>
      <div class="callout">
        <div class="callout-header">
          <i data-lucide="lightbulb"></i>
          Pro Tip
        </div>
        <p style="margin:0;color:var(--muted)">
          Temporarily disabling your VPN until the application has connected will, in many cases, allow the app to function normally even after the VPN is re-enabled.
        </p>
      </div>
      <h3>TCP and UDP Behavior</h3>
      <ul>
        <li><b>UDP:</b> UDP is a connectionless protocol that sends packets to a specific destination address and port. If a VPN reroutes traffic or performs NAT that alters the source IP or port, the receiving service may drop the packets because they appear to originate from an unexpected address (for example, a VPN-assigned address instead of a local 192.168.x.x address).</li>
        <li><b>TCP:</b> TCP is connection-oriented and requires a successful handshake between client and server. If a VPN changes routing in a way that prevents traffic from reaching the local network, connections to services bound to local interfaces may fail.</li>
      </ul>
      <blockquote>
        RemotePC uses both the UDP and TCP protocols, but it is for the most part TCP based.
      </blockquote>
    `
  },

  'windows-defender': {
    title:    'Why does Windows Defender &amp; SmartScreen flag <span class="text-gradient">RemotePC</span>?',
    subtitle: 'A full breakdown of why this warning appears, what it actually means, how code signing works, and exactly how to safely proceed.',
    category: { icon: 'shield-alert', label: 'Article: Windows Defender &amp; SmartScreen' },
    meta: { date: 'January 22, 2026 | Rev. March 20, 2026', readTime: '8 min read', author: 'RemotePC Team' },
    image: { src: '/assets/example.jpg', alt: 'SmartScreen Example' },
    content: `
      <h2>How RemotePC actually works</h2>
      <p>Before diving into the warning itself, it helps to understand what RemotePC does under the hood — because this context is exactly what makes Windows suspicious.</p>
      <p>RemotePC is split into two components that talk to each other over your local network (or the internet, if configured):</p>
      <ul>
        <li><strong>The Android app</strong> acts as the controller. It sends commands (e.g. Shutdown, Sleep, Lock) or requests data streams (e.g. live screenshots, hardware stats, real-time screen mirroring) to the Windows host.</li>
        <li><strong>The Windows app</strong> acts as the host agent. It listens for authenticated instructions and executes them by calling native Windows APIs — things like <code>SetSuspendState()</code>, <code>LockWorkStation()</code>, or the Graphics Device Interface (GDI) for screen capture.</li>
      </ul>
      <p>In short: an executable sits on your PC, listens on a network port, and runs system-level calls when commanded. From Windows' perspective, that description fits a lot of remote access trojans (RATs) — which is precisely why Defender raises an eyebrow.</p>

      <h2>What SmartScreen actually is</h2>
      <p>Windows SmartScreen is a cloud-based reputation system built into Windows Defender and Microsoft Edge. Every time you run a downloaded executable, Windows sends a hash (a unique fingerprint) of that file to Microsoft's servers. Microsoft looks up that hash against a database of known software and checks two things:</p>
      <ul>
        <li><strong>Is it signed?</strong> — Does it have a valid digital certificate from a trusted Certificate Authority (CA)?</li>
        <li><strong>Does it have reputation?</strong> — Have enough users downloaded and run this exact file without reporting it as malicious?</li>
      </ul>
      <p>If either check fails, SmartScreen shows the blue "Windows protected your PC" warning. It does <em>not</em> mean the file is malicious — it means the file is unknown or unverified. There is an important difference.</p>

      <div class="callout">
        <div class="callout-header">
          <i data-lucide="info"></i>
          What the warning actually says
        </div>
        <p style="margin:0;color:var(--muted)">
          "Windows protected your PC — Microsoft Defender SmartScreen prevented an unrecognized app from starting. Running this app might put your PC at risk." The key word is <strong style="color:var(--text)">unrecognized</strong>, not <em>dangerous</em>. SmartScreen is flagging a lack of history, not a detected threat.
        </p>
      </div>

      <h2>Why RemotePC is unsigned</h2>
      <p>Digital code signing requires purchasing an Authenticode certificate from a Certificate Authority such as DigiCert, Sectigo, or GlobalSign. There are two tiers:</p>
      <ul>
        <li><strong>Standard (OV) certificates</strong> — Organization Validation. Costs roughly $200–$400 per year. Removes the "unknown publisher" label but does not immediately grant SmartScreen reputation — that still builds over time based on download volume.</li>
        <li><strong>Extended Validation (EV) certificates</strong> — Requires a full legal identity audit and costs $300–$700+ per year. Grants <em>instant</em> SmartScreen reputation, bypassing the warning from the very first download.</li>
      </ul>
      <p>RemotePC is a free, non-monetized tool. There are no ads, no in-app purchases, and no subscription fees. Our only ongoing costs are domain registration and hosting — and even those are already a stretch for a passion project. Spending $300–$700 per year purely to eliminate a dismissible warning is simply not financially viable at this stage.</p>
      <blockquote>We made a deliberate choice: keep RemotePC free and transparent rather than charge users or inject ads just to fund a certificate. We believe that's the right trade-off, and we want you to understand exactly why.</blockquote>

      <h2>Does "unsigned" mean unsafe?</h2>
      <p>No. Code signing is a trust mechanism, not a malware scanner. A signed application simply means a certificate authority has verified the <em>identity</em> of the publisher — it says nothing about what the code actually does. There have been documented cases of malware signed with legitimate, stolen certificates. Conversely, countless safe, open-source, and independent tools ship unsigned.</p>
      <p>What actually determines whether software is safe is its code — and RemotePC's source behavior can be independently verified:</p>
      <ul>
        <li>All network communication happens on a port you configure, and only responds to authenticated sessions.</li>
        <li>No data is routed through external servers. Everything stays on your local network unless you explicitly set up remote access.</li>
        <li>The app does not run at startup unless you enable that option manually.</li>
        <li>No telemetry, usage data, or personal information is collected or transmitted to us.</li>
      </ul>

      <h2>How to run RemotePC despite the warning</h2>
      <p>If you downloaded RemotePC from <strong>remotepc.tech</strong> and see the SmartScreen warning, here is how to proceed safely:</p>
      <ol>
        <li>When the blue SmartScreen dialog appears, click <strong>"More info"</strong> (the small link below the main message).</li>
        <li>A second screen will appear showing the app name and publisher. Click <strong>"Run anyway"</strong>.</li>
        <li>Windows will remember your choice for this specific file. You won't be asked again for the same executable.</li>
      </ol>
      <div class="callout">
        <div class="callout-header">
          <i data-lucide="shield-check"></i>
          Always verify your download source
        </div>
        <p style="margin:0;color:var(--muted)">
          Before clicking "Run anyway" on <em>any</em> application, confirm you downloaded it directly from the official website — <strong style="color:var(--text)">remotepc.tech</strong>. If you received the file via a link in an email, a third-party download site, or a message from someone you don't know, do not run it. The official site is the only trusted source.
        </p>
      </div>

      <h2>Windows Defender antivirus vs. SmartScreen</h2>
      <p>It's worth distinguishing between two separate Windows security systems that both fall under the "Windows Defender" umbrella:</p>
      <ul>
        <li><strong>Windows Defender Antivirus</strong> — Scans files for known malware signatures and suspicious behavior patterns. If this flags a file, that is a stronger signal of a genuine threat.</li>
        <li><strong>SmartScreen</strong> — The reputation-based warning system described above. This is what triggers for RemotePC. It is a softer warning based on unfamiliarity, not a malware detection.</li>
      </ul>
      <p>RemotePC does not trigger Windows Defender Antivirus. Only SmartScreen flags it, and only because of the missing certificate and low download volume relative to mainstream software.</p>

      <h2>Our commitment to your privacy &amp; security</h2>
      <ul>
        <li>RemotePC will never exfiltrate your data to any external server.</li>
        <li>We will never bundle adware, toolbars, or any third-party software with the installer.</li>
        <li>If a signing certificate becomes financially feasible in the future, we will obtain one and eliminate this warning entirely.</li>
        <li>If you ever have concerns about the app's behavior, you are encouraged to inspect network traffic using a tool like Wireshark — everything it does is on your own network.</li>
      </ul>
      <blockquote>RemotePC will never compromise your privacy or security. The SmartScreen warning is a reflection of our budget, not our intentions.</blockquote>
    `
  },

  'drag-drop': {
    title:    'Why Windows blocks <span class="text-gradient">drag and drop</span> between privilege levels',
    subtitle: 'This behavior is enforced by User Account Control (UAC) and Mandatory Integrity Control (MIC) to prevent privilege escalation.',
    category: { icon: 'shield', label: 'Article: Windows Security Model' },
    meta: null,
    image: null,
    content: `
      <h2>Integrity Level Separation</h2>
      <p>Windows assigns an integrity level to every process. This level determines what other processes it can interact with. The key rule enforced by the system is:</p>
      <blockquote>Lower integrity processes cannot send data to higher integrity processes ("no write up").</blockquote>
      <div class="diagram">
        <div class="box medium">Standard App<br><small>(Medium Integrity)</small></div>
        <div class="box high">Admin App<br><small>(High Integrity)</small></div>
      </div>
      <div class="arrow blocked">🚫 Drag &amp; Drop Blocked</div>
      <p>Even though both applications belong to the same user, Windows treats them as different trust boundaries.</p>

      <h2>What actually gets blocked</h2>
      <p>Drag and drop is not just a UI feature — it relies on multiple IPC mechanisms:</p>
      <ul>
        <li><b>Window messages</b> (e.g. <code>WM_DROPFILES</code>)</li>
        <li><b>OLE drag-and-drop</b> via <code>IDropTarget</code></li>
        <li><b>COM data transfer</b> between processes</li>
      </ul>
      <p>These mechanisms require one process to send structured data into another process's context. When integrity levels differ, Windows blocks this interaction at the kernel and user32 boundary.</p>

      <h2>Relevant Windows APIs</h2>
      <p>There are APIs that relate to message filtering, but they do not bypass integrity isolation:</p>
      <ul>
        <li><code>ChangeWindowMessageFilterEx</code> – allows specific messages through, but only within limits</li>
        <li><code>AllowSetForegroundWindow</code> – unrelated to drag/drop but often confused</li>
        <li><code>CoInitializeSecurity</code> – controls COM security boundaries</li>
      </ul>
      <p>Importantly, <code>ChangeWindowMessageFilterEx</code> cannot override MIC restrictions for drag-and-drop data transfer.</p>
      <p>We are currently looking for ways to make it work, however due to the described security lockdowns, a solution will be delayed for the future, or indefinitely.</p>

      <h2>Why Microsoft enforces this</h2>
      <p>If drag and drop were allowed freely across privilege levels, it would enable:</p>
      <ul>
        <li><b>Shatter attacks</b> via crafted window messages</li>
        <li><b>Data injection</b> into elevated processes</li>
        <li><b>Privilege escalation chains</b></li>
      </ul>
      <p>Historically, older versions of Windows (pre-Vista) were vulnerable to these types of attacks, which is why UAC introduced strict isolation.</p>

      <h2>Why Administrative Privileges Are Required By RemotePC</h2>
      <p>Accessing system temperature sensors requires administrative privileges because these sensors are part of protected hardware interfaces. Standard user processes do not have permission to read from or interact with these low-level system resources, ensuring that critical hardware data cannot be tampered with or accessed by untrusted applications.</p>
      <p>Running the application as an administrator allows it to safely query sensor data directly from the system, providing accurate readings while maintaining Windows security boundaries.</p>
      <p>We are currently evaluating whether allowing the application to run as a non-administrative process — controlled via a toggle in the settings — would be a viable option for users. Running in this mode would enable features like drag-and-drop but would disable access to hardware temperature sensors. As a result, temperature readings would not be available in the Android app.</p>

      <p><code>android.permission.POST_NOTIFICATIONS</code> is required for foreground services to display persistent notifications. On Android, a foreground service must show a notification; this ensures that long-running tasks like file transfers remain active even if the app is closed by the user.</p>

      <h2>4. Foreground Service Permissions</h2>

      <h2>6. FileProvider</h2>

function render() {
